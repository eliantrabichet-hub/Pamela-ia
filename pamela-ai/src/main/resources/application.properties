# Render provides PORT at runtime; use 8080 locally.
server.port=${PORT:8080}

# Keep API credentials in Render Environment settings, never in frontend files.
pamela.api.key=${PAMELA_API_KEY:}
pamela.api.url=${PAMELA_API_URL:https://api.openai.com/v1/chat/completions}
pamela.api.model=${PAMELA_API_MODEL:gpt-4o-mini}

# If using a Render persistent disk, mount it at /app/data.
spring.datasource.url=jdbc:h2:file:/app/data/pamela-db
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=false
